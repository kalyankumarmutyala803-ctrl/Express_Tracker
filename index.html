<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="small-title">PERSONAL FINANCE</p>
                <h1>Expense Tracker</h1>
                <p class="subtitle">
                    Track your income and expenses easily.
                </p>
            </div>

            <button id="clearAll" class="clear-btn">
                Clear All
            </button>
        </header>


        <!-- Summary Cards -->
        <section class="summary">

            <div class="summary-card balance">
                <p>Total Balance</p>
                <h2 id="balance">₹0.00</h2>
            </div>

            <div class="summary-card income">
                <p>Total Income</p>
                <h2 id="income">₹0.00</h2>
            </div>

            <div class="summary-card expense">
                <p>Total Expenses</p>
                <h2 id="expense">₹0.00</h2>
            </div>

        </section>


        <!-- Main Content -->
        <main class="main-grid">

            <!-- Add Transaction -->
            <section class="card">

                <h2>Add Transaction</h2>

                <form id="expenseForm">

                    <label>
                        Description
                        <input
                            type="text"
                            id="description"
                            placeholder="Example: Grocery"
                            required
                        >
                    </label>


                    <label>
                        Amount
                        <input
                            type="number"
                            id="amount"
                            placeholder="500"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </label>


                    <label>
                        Transaction Type

                        <select id="type">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>

                    </label>


                    <label>
                        Category

                        <select id="category">
                            <option>Food</option>
                            <option>Travel</option>
                            <option>Shopping</option>
                            <option>Bills</option>
                            <option>Education</option>
                            <option>Entertainment</option>
                            <option>Salary</option>
                            <option>Other</option>
                        </select>

                    </label>


                    <label>
                        Date

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </label>


                    <button
                        type="submit"
                        class="add-btn"
                    >
                        + Add Transaction
                    </button>

                </form>

            </section>


            <!-- Transactions -->
            <section class="card transactions-card">

                <div class="transaction-header">

                    <div>
                        <h2>Transactions</h2>
                        <p id="count">0 transactions</p>
                    </div>

                    <select id="filter">

                        <option value="all">
                            All
                        </option>

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expenses
                        </option>

                    </select>

                </div>


                <div id="transactions">

                    <div class="empty">
                        No transactions yet.
                        <br>
                        Add your first transaction.
                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
